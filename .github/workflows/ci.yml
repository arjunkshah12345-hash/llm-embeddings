name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile
        run: python -m py_compile config.py data.py token_classes.py model.py train.py evaluate.py analyze.py aggregate_results.py aggregate_mechanism.py aggregate_rank.py aggregate_embedding_eval.py aggregate_secondary.py export_release_artifacts.py paper/generate_figures.py paper/generate_tables.py paper/package_arxiv.py sweep.py adapter_sweep.py embedding_eval.py mechanism_eval.py validate_study.py kaggle/launch.py kaggle/collect.py test_model.py test_data.py test_token_classes.py test_study.py test_sweep.py test_analyze.py test_adapter_sweep.py test_embedding_eval.py test_aggregate_results.py test_aggregate_mechanism.py test_aggregate_rank.py test_aggregate_embedding_eval.py test_aggregate_secondary.py test_export_release_artifacts.py test_paper_tables.py test_package_arxiv.py test_kaggle_launch.py
      - name: Test
        run: python -m pytest -q
      - name: End-to-end smoke
        run: |
          python sweep.py \
            --output_dir runs/ci-e2e \
            --dataset fixture --device cpu --seeds 1337 \
            --steps 3 --batch_size 1 --block_size 8 \
            --n_layer 1 --n_head 1 --n_embd 16 \
            --adapter_rank 2 --adapter_alpha 2 \
            --warmup_steps 1 --eval_interval 1 --eval_batches 1 \
            --log_interval 1 --save_interval 3 --no-save_optimizer \
            --skip_analysis
          python validate_study.py --runs_dir runs/ci-e2e
          python analyze.py --runs_dir runs/ci-e2e --output_dir runs/ci-e2e/analysis
