name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile
        run: python -m py_compile $(git ls-files '*.py')
      - name: Test
        run: python -m pytest -q
      - name: End-to-end artifact smoke (no training)
        run: |
          python ci_fixture.py --output_dir runs/ci-e2e
          python validate_study.py --runs_dir runs/ci-e2e
          python analyze.py --runs_dir runs/ci-e2e --output_dir runs/ci-e2e/analysis
